- name: Diagnóstico de conectividade
        run: |
          echo "=== Testando HTTP (porta 80) ==="
          curl -v --max-time 15 http://www.propaae.uefs.br || echo "FALHOU: HTTP"
          echo "=== Testando HTTPS (porta 443) ==="
          curl -v --max-time 15 https://www.propaae.uefs.br || echo "FALHOU: HTTPS"
          echo "=== Resolução DNS ==="
          nslookup www.propaae.uefs.br || true
          echo "=== Traceroute (portas TCP) ==="
          traceroute -T -p 80 www.propaae.uefs.br || echo "traceroute não disponível/falhou"
          echo "=== IP público do runner ==="
          curl -s https://ifconfig.me || true
